[project]
name = "immortalwrt-builder"
version = "0.1.0"
description = "ImmortalWrt build orchestration CLI and GitHub Actions builder"
readme = "README.md"
requires-python = ">=3.14"
license-files = ["LICENSE"]
authors = [{ name = "u9521" }]
dependencies = []

[project.scripts]
iwb = "immortalwrt_builder.builder.cli.app:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
]
ignore = [
    "E501",
    "B008",
]

[tool.pyright]
include = ["immortalwrt_builder"]
exclude = [".venv", "source-code", "cache", "out"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
