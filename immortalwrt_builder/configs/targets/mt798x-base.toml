name = "mt798x-base"
base = true

[source]
url = "https://github.com/hanwckf/immortalwrt-mt798x.git"
branch = "openwrt-21.02"
depth = 1
submodules = false

[build]
download = true
ignore_errors = false

[ccache]
enabled = true
max_size = "3.5G"

[toolchain_cache]
enabled = true
auto_restore = true
auto_save = true

[output]
target_dir = "bin/targets/mediatek/mt7981"
packages_dir = "bin/packages"
calculate_digest = true
